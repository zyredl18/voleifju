<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Controle Técnico · Vôlei</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">Vôlei · pelada 4x4<b>Registro de ações</b></div>
  </div>
  <div class="top-row second">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabJogadores" role="tab" aria-selected="true">Jogadores</button>
      <button class="tab" id="tabJogo" role="tab" aria-selected="false">Jogo</button>
      <button class="tab" id="tabRegistro" role="tab" aria-selected="false">Ações</button>
    </div>
  </div>
  <div class="legend">
    <i style="background:var(--pos)"></i><i style="background:var(--neutro)"></i>
    <i style="background:var(--neg)"></i>
  </div>
</header>

<main style="padding-bottom:84px">
  <section id="viewJogo"></section>
  <section id="viewEsc" hidden></section>
  <section id="viewRegistro" hidden></section>
  <section id="viewJogadores" hidden></section>
</main>

<nav class="bar">
  <button class="undo" id="undoBtn" disabled>↩ <small id="undoTxt">nada</small></button>
  <button class="export" id="exportBtn">Exportar XLSX</button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <div class="sheet-head"><b id="mTitle">Escolher jogador</b><button id="mClose" aria-label="Fechar">×</button></div>
    <input id="mSearch" placeholder="buscar pelo nome" autocomplete="off">
    <div id="mList"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
